<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TOM FORD BEAUTY - Privacy Request</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: #30343b;
        }

        /* MAIN CONTAINER */

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 45px 70px;
        }

        /* LOGO */

        .logo {
            text-align: right;
            font-size: 62px;
            font-weight: bold;
            letter-spacing: -4px;
            color: #111827;
            margin-bottom: 35px;
        }

        /* DESCRIPTION */

        .description {
            width: 520px;
            margin-left: auto;
            margin-bottom: 35px;
        }

        .description p {
            font-size: 16px;
            line-height: 1.55;
            color: #555;
            margin: 0;
        }

        /* FORM */

        .form-container {
            width: 520px;
            margin-left: auto;
        }

        /* LABEL */

        label {
            display: block;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #4a4d53;
        }

        .required {
            color: #b76a83;
            margin-right: 5px;
        }

        /* BUTTONS */

        .type-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .type-btn {
            width: 120px;
            height: 65px;

            background: white;

            border: 1px solid #bfc3c8;

            border-radius: 4px;

            font-size: 15px;

            color: #555;

            cursor: pointer;
        }

        .type-btn:hover {
            border-color: #555;
        }

        .type-btn.active {
            border: 2px solid #555;
            color: #333;
        }

        /* INPUTS */

        .input-group {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            height: 55px;

            border: 1px solid #bfc3c8;

            padding: 10px 15px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border: 2px solid #555;
        }

        /* SUBJECT */

        .subject-box {
            position: relative;
        }

        .subject-box input {
            padding-right: 45px;
        }

        .clear {
            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 25px;

            color: #777;

            cursor: pointer;
        }

        /* CHECKBOX */

        .robot {
            margin-top: 15px;

            display: flex;

            align-items: center;

            gap: 10px;
        }

        .robot input {
            width: 20px;
            height: 20px;
        }

        .robot label {
            margin: 0;
            font-weight: normal;
            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            .container {
                padding: 30px 25px;
            }

            .logo {
                text-align: center;
                font-size: 45px;
            }

            .description,
            .form-container {
                width: 100%;
                margin-left: 0;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- LOGO -->

        <div class="logo">
            TOM FORD BEAUTY
        </div>


        <!-- DESCRIPTION -->

        <div class="description">

            <p>
                We respect your concerns about privacy and value the
                relationship we have with you. You can use this form to
                submit a request regarding your personal data. ELC will
                process your request in accordance with applicable law.
            </p>

        </div>


        <!-- FORM -->

        <div class="form-container">


            <!-- I AM AN -->

            <div class="input-group">

                <label>
                    <span class="required">*</span>
                    I am an
                </label>


                <div class="type-buttons">

                    <button
                        class="type-btn"
                        onclick="selectType(this)">

                        Consumer

                    </button>


                    <button
                        class="type-btn"
                        onclick="selectType(this)">

                        Other

                    </button>

                </div>

            </div>


            <!-- LOCATION -->

            <div class="input-group">

                <label>
                    <span class="required">*</span>
                    Location
                </label>

                <input
                    type="text"
                    placeholder=""
                >

            </div>


            <!-- SUBJECT -->

            <div class="input-group">

                <label>
                    <span class="required">*</span>
                    First Name
                </label>


                <div class="subject-box">

                    <input
                        type="text"
                        id="First Name"
                    >

                    <span
                        class="clear"
                    

                        ×

                    </span>

                </div>

            </div>


            <!-- LAST NAME -->

            <div class="input-group">

                <label>
                    <span class="required">*</span>
                    Last Name
                </label>

                <input
                    type="text"
                >

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label>
                    <span class="required">*</span>
                    Email
                </label>

                <input
                    type="email"
                >

            </div>


            <!-- ROBOT -->

            <div class="robot">

                <input
                    type="checkbox"
                    id="robot"
                >

                <label for="robot">
                    I'm not a robot
                </label>


        
            </div>


<input
                type="submit"
                value="Submit"
            >


        </div>


    </div>


    <script>

        /* CONSUMER / OTHER BUTTON */

        function selectType(button) {

            document
                .querySelectorAll(".type-btn")
                .forEach(function(btn) {

                    btn.classList.remove("active");

                });

            button.classList.add("active");

        }


        /* CLEAR SUBJECT */

        function clearSubject() {

            document.getElementById("subject").value = "";

        }

    </script>


</body>

</html>
